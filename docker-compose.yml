services:

  # ---------------------------------------------------------------------------
  # Bootstrap: Writes secret files on first run into a named volume.
  # Env vars are optional – sane defaults and generated passwords are used
  # if nothing is provided. Credentials are printed once to docker logs.
  # On subsequent deploys the volume already contains real credentials and
  # bootstrap skips all files automatically.
  # ---------------------------------------------------------------------------
  bootstrap:
    build: ./bootstrap
    restart: "no"
    volumes:
      - secrets_data:/secrets
    environment:
      DB_NAME:            ${DB_NAME:-}
      DB_ADMIN_USER:      ${DB_ADMIN_USER:-}
      DB_ADMIN_PASSWORD:  ${DB_ADMIN_PASSWORD:-}
      DB_WORKER_USER:     ${DB_WORKER_USER:-}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:-}

  # ---------------------------------------------------------------------------
  # PostgreSQL – starts only after bootstrap has completed successfully.
  # Secrets are read from the shared named volume, not from host files,
  # so no placeholder files need to exist in the repository.
  # ---------------------------------------------------------------------------
  postgres:
    build: ./postgres
    restart: unless-stopped
    container_name: orderdb
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB_FILE:       /run/secrets/db_name.txt
      POSTGRES_USER_FILE:     /run/secrets/db_admin_user.txt
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password.txt
    volumes:
      - secrets_data:/run/secrets:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/db_admin_user.txt) -d $(cat /run/secrets/db_name.txt)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - n8n-backend

  # ---------------------------------------------------------------------------
  # Konfiguration – schreibt die Variablen unten bei jedem Start nach
  # app_config (Werte aus der .env bzw. den Umgebungsvariablen des Projekts
  # im Hosting-Panel). Leere Variablen werden übersprungen, der Wert in der
  # Datenbank bleibt dann, wie er ist. Danach bleibt der Container im
  # Leerlauf; durch "unless-stopped" läuft er auch nach einem Server-Neustart
  # erneut. Neue oder geänderte Werte kommen nur mit "docker compose up -d"
  # an (Container wird neu erstellt), NICHT mit "docker compose restart".
  # Namensschema und Details: config-loader/apply-config.sh, README Schritt 5.
  # ---------------------------------------------------------------------------
  config:
    build: ./config-loader
    restart: unless-stopped
    container_name: app-config
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - secrets_data:/run/secrets:ro
    environment:
      ETSY_API_KEY:              ${ETSY_API_KEY:-}
      ETSY_SHOP_ID:              ${ETSY_SHOP_ID:-}
      ETSY_SYNC_START:           ${ETSY_SYNC_START:-}
      NOTION_DATABASE_ID:        ${NOTION_DATABASE_ID:-}
      MAIL_FROM:                 ${MAIL_FROM:-}
      MAIL_TO:                   ${MAIL_TO:-}
      SELLER_NAME:               ${SELLER_NAME:-}
      SELLER_BUSINESS_NAME:      ${SELLER_BUSINESS_NAME:-}
      SELLER_TAGLINE:            ${SELLER_TAGLINE:-}
      SELLER_STREET:             ${SELLER_STREET:-}
      SELLER_ZIP:                ${SELLER_ZIP:-}
      SELLER_CITY:               ${SELLER_CITY:-}
      SELLER_COUNTRY:            ${SELLER_COUNTRY:-}
      SELLER_EMAIL:              ${SELLER_EMAIL:-}
      SELLER_PHONE:              ${SELLER_PHONE:-}
      SELLER_WEBSITE:            ${SELLER_WEBSITE:-}
      SELLER_IBAN:               ${SELLER_IBAN:-}
      SELLER_BANK_NAME:          ${SELLER_BANK_NAME:-}
      SELLER_TAX_ID:             ${SELLER_TAX_ID:-}
      SELLER_VAT_ID:             ${SELLER_VAT_ID:-}
      SELLER_KLEINUNTERNEHMER:   ${SELLER_KLEINUNTERNEHMER:-}
      ETSY_RC_RECIPIENT_NAME:    ${ETSY_RC_RECIPIENT_NAME:-}
      ETSY_RC_RECIPIENT_STREET:  ${ETSY_RC_RECIPIENT_STREET:-}
      ETSY_RC_RECIPIENT_ZIP:     ${ETSY_RC_RECIPIENT_ZIP:-}
      ETSY_RC_RECIPIENT_CITY:    ${ETSY_RC_RECIPIENT_CITY:-}
      ETSY_RC_RECIPIENT_COUNTRY: ${ETSY_RC_RECIPIENT_COUNTRY:-}
      ETSY_RC_RECIPIENT_VAT_ID:  ${ETSY_RC_RECIPIENT_VAT_ID:-}
      ETSY_RC_START_DATE:        ${ETSY_RC_START_DATE:-}
      ETSY_RC_PAYMENT_NOTE:      ${ETSY_RC_PAYMENT_NOTE:-}
      ETSY_RC_NOTE:              ${ETSY_RC_NOTE:-}
      LEXOFFICE_START_MONTH:     ${LEXOFFICE_START_MONTH:-}
    networks:
      - n8n-backend

  # ---------------------------------------------------------------------------
  # Typst PDF API – erzeugt Rechnungen, Lieferscheine, Versandetiketten.
  # Erreichbar für n8n intern unter: http://typst-api:8080
  # ---------------------------------------------------------------------------
  typst-api:
    build: ./typst-api
    restart: unless-stopped
    container_name: typst-api
    networks:
      - n8n-backend
    # Nur für lokale Entwicklung / Tests von außen:
    # ports:
    #   - "8080:8080"

  # ---------------------------------------------------------------------------
  # Adminer – Web-Oberfläche für die Datenbank (wie phpMyAdmin, für Postgres).
  # Optional: startet NICHT mit "docker compose up -d", nur mit
  #   docker compose --profile tools up -d adminer
  # Port nur auf 127.0.0.1 des Servers → Zugriff per SSH-Tunnel (README).
  # Nie auf 0.0.0.0 bzw. ohne IP veröffentlichen: das wäre ein Login zur
  # Buchhaltungs-DB direkt im Internet.
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:5.5.1
    profiles: ["tools"]
    # IPv4 statt [::] (Standard des Images): ohne IPv6 im Container beendet sich
    # Adminer sonst sofort ("Failed to listen on [::]:8080")
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    restart: "no"
    container_name: adminer
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: orderdb
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - n8n-backend
      # Ist n8n-backend als internes Netz angelegt (--internal), veröffentlicht
      # Docker dort keine Ports; über dieses zusätzliche Netz klappt die
      # Freigabe auf 127.0.0.1. Postgres und typst-api hängen nicht daran.
      - adminer-access

networks:
  n8n-backend:
    external: true
  adminer-access: {}

# ---------------------------------------------------------------------------
# Volumes mit festen Namen, als "external" markiert: Compose legt sie nie
# selbst an und löscht sie nie. Weder "docker compose down -v" noch das
# Löschen des Projekts im Hosting-Panel noch ein anderer Projektname
# berühren die Daten. Einmalig vor dem ersten Start anlegen (README):
#   docker volume create bookkeeping_pgdata
#   docker volume create bookkeeping_secrets
# Fehlt eines, bricht "docker compose up" mit einer Fehlermeldung ab, statt
# still mit einer leeren Datenbank zu starten.
# ---------------------------------------------------------------------------
volumes:
  secrets_data:
    external: true
    name: bookkeeping_secrets
  postgres_data:
    external: true
    name: bookkeeping_pgdata
